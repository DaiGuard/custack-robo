; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = arm_right_gatling, arm_left_gatling

[env]
platform = atmelmegaavr
board = ATtiny1614
framework = arduino
board_build.f_cpu = 20000000L
board_hardware.millistimer = rtc
upload_protocol = serialupdi
upload_flags =
    -b
    115200
board_hardware.bod = 2.6V
board_hardware.eesave = yes

; ========================================================
; 右アーム環境 (I2Cスレーブアドレス: 0x31)
; ========================================================
; 1. ガトリング (Gatling: 0x01)
[env:arm_right_gatling]
build_flags = 
    -D FW_VERSION=0x10
    -D DEVICE_ID=0x01
    -D I2C_SLAVE_ADDR=0x31

; 2. ソード (Sword: 0x02)
[env:arm_right_sword]
build_flags = 
    -D FW_VERSION=0x10
    -D DEVICE_ID=0x02
    -D I2C_SLAVE_ADDR=0x31

; 3. 大型レーザーキャノン (Laser Cannon: 0x03)
[env:arm_right_cannon]
build_flags = 
    -D FW_VERSION=0x10
    -D DEVICE_ID=0x03
    -D I2C_SLAVE_ADDR=0x31

; 後方互換用エイリアス (デフォルト: ガトリング)
[env:arm_right]
build_flags = 
    -D FW_VERSION=0x10
    -D DEVICE_ID=0x01
    -D I2C_SLAVE_ADDR=0x31

; ========================================================
; 左アーム環境 (I2Cスレーブアドレス: 0x32)
; ========================================================
; 1. ガトリング (Gatling: 0x01)
[env:arm_left_gatling]
build_flags = 
    -D FW_VERSION=0x10
    -D DEVICE_ID=0x01
    -D I2C_SLAVE_ADDR=0x32

; 2. ソード (Sword: 0x02)
[env:arm_left_sword]
build_flags = 
    -D FW_VERSION=0x10
    -D DEVICE_ID=0x02
    -D I2C_SLAVE_ADDR=0x32

; 3. 大型レーザーキャノン (Laser Cannon: 0x03)
[env:arm_left_cannon]
build_flags = 
    -D FW_VERSION=0x10
    -D DEVICE_ID=0x03
    -D I2C_SLAVE_ADDR=0x32

; 後方互換用エイリアス (デフォルト: ガトリング)
[env:arm_left]
build_flags = 
    -D FW_VERSION=0x10
    -D DEVICE_ID=0x01
    -D I2C_SLAVE_ADDR=0x32
